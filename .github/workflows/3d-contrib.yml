name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "0 18 * * *"   # runs every day at 6pm UTC
  workflow_dispatch:        # lets you run it manually from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Graph

    steps:
      - uses: actions/checkout@v3

      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Rishabh2233eng

      - name: Commit and Push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "Update 3D contribution graph"
          git push
